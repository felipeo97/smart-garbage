<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Basurero Inteligente</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:800px; margin:40px auto; padding:0 16px; }
    .card { border:1px solid #ddd; padding:16px; border-radius:8px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    img.preview { max-width:300px; max-height:300px; display:block; margin-top:12px; }
    pre { background:#f6f6f6; padding:8px; border-radius:6px; }

    /* ----- Reset suave ----- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ----- Fondo general ----- */
body {
  font-family: "Inter", Arial, sans-serif;
  background: linear-gradient(135deg, #d9f4e8, #f0fdfa);
  min-height: 100vh;
  padding: 40px 16px;
  color: #222;
  display: block; /* o simplemente borra display:flex */
}


/* ----- Contenedor principal ----- */
h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #05603a;
  font-weight: 800;
}

/* ----- Tarjeta ----- */
.card {
  background: #ffffff;
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  animation: fadeIn 0.4s ease;
}

/* Animación suave */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ----- Botón ---- */
button {
  margin-top: 16px;
  background: #059669;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s, transform 0.15s;
}

button:hover {
  background: #047857;
}

button:active {
  transform: scale(0.97);
}

/* Ocultar input file */
input[type="file"] {
  display: none;
}

/* Botón personalizado para subir archivo */
.custom-file-label {
  background: #059669;
  color: white;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-block;
  margin-top: 12px;
  transition: background 0.2s, transform 0.15s;
}

.custom-file-label:hover {
  background: #047857;
}

.custom-file-label:active {
  transform: scale(0.97);
}

#previewArea {
  margin-bottom: 20px;
}



/* ----- Preview imagen ----- */
img.preview {
  margin-top: 15px;
  max-width: 300px;
  max-height: 300px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  transition: 0.3s;
}

img.preview:hover {
  transform: scale(1.02);
}

/* ----- Resultado ----- */
#result {
  margin-top: 20px;
  background: #f9fafb;
  padding: 16px;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.6;
  border-left: 4px solid #059669;
}

/* ----- Listas ----- */
ul {
  margin-top: 10px;
  padding-left: 20px;
}

li {
  margin: 4px 0;
}
  </style>
</head>
<body>
  <h1>Basurero Inteligente</h1>

  <div class="card">
    <p>Sube una imagen de basura para que el modelo la clasifique en: <strong>caneca, verde, negra, blanca</strong>.</p>

    <input type="file" id="file" accept="image/*" />
    <label for="file" class="custom-file-label">Seleccionar archivo</label>
    <button id="send">Clasificar</button>

    <div id="previewArea"></div>

    <h3>Resultado:</h3>
    <div id="result">Aún no hay resultado.</div>
  </div>

<script>
document.getElementById('file').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  const p = document.getElementById('previewArea');
  p.innerHTML = '';
  if (!file) return;
  const img = document.createElement('img');
  img.className = 'preview';
  img.src = URL.createObjectURL(file);
  p.appendChild(img);
});

document.getElementById('send').addEventListener('click', async () => {
  const fileInput = document.getElementById('file');
  if (!fileInput.files.length) return alert('Selecciona una imagen primero');
  const fd = new FormData();
  fd.append('image', fileInput.files[0]);

  // Llamada al endpoint que definimos: /api/classify/
  const res = await fetch('/api/classify/', {
    method: 'POST',
    body: fd
    // No enviamos headers, dejamos al navegador gestionar multipart/form-data
  });

  const data = await res.json();
  if (!res.ok) {
    document.getElementById('result').innerText = 'Error: ' + (data.error || JSON.stringify(data));
    return;
  }

  // Mostrar resultado bonito
  const all = data.all || {};
  let html = `<p><strong>Clase:</strong> ${data.label} — <strong>Confianza:</strong> ${(data.probability*100).toFixed(1)}%</p>`;
  html += '<h4>Probabilidades:</h4><ul>';
  for (const k in all) {
    html += `<li>${k}: ${(all[k]*100).toFixed(1)}%</li>`;
  }
  html += '</ul>';
  document.getElementById('result').innerHTML = html;
});
</script>
</body>
</html>
